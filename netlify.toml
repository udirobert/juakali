# Netlify — Expo web (SPA) for investor review
# Docs: https://docs.expo.dev/guides/publishing-websites/#netlify
# Use npm here so builds don't depend on mise downloading Bun (GitHub release 503s).
# verify:lock fails fast if the lockfile was regenerated on a machine whose npm
# pruned cross-platform optional binaries (the lightningcss linux CI incident).
[build]
  base = "/"
  command = "npm run verify:lock && npm install --ignore-scripts && npm run export:web -w @bloom/mobile"
  publish = "apps/default/dist"

[build.environment]
  NODE_VERSION = "22"
  HUSKY = "0"
  # Public Convex prod (safe to bake into the client bundle)
  EXPO_PUBLIC_CONVEX_URL = "https://zealous-scorpion-285.convex.cloud"
  EXPO_PUBLIC_CONVEX_SITE_URL = "https://zealous-scorpion-285.convex.site"
  # Review builds: loud teaching + soft fidelity badge (see plans/product-axes.md)
  EXPO_PUBLIC_PRODUCT_PRESET = "demo"
  # Lab chat optional until Cloud Run is live
  # EXPO_PUBLIC_AGENT_URL = "https://your-agent.run.app"

# Per-deal share cards: /deal/<slug> proxies to a Convex HTTP route that serves
# live Open Graph meta, then meta-refreshes humans into the SPA (?ledger=<slug>).
# Must come before the catch-all below.
[[redirects]]
  from = "/deal/*"
  to = "https://zealous-scorpion-285.convex.site/share/ledger?slug=:splat"
  status = 200

# Public JSON ledger API — same data the app reads, open for citation.
[[redirects]]
  from = "/api/ledger"
  to = "https://zealous-scorpion-285.convex.site/api/ledger"
  status = 200
  force = true

# Embeddable deal widget — partners drop <script src="/embed.js" data-deal="<slug>"></script>.
[[redirects]]
  from = "/embed.js"
  to = "https://zealous-scorpion-285.convex.site/embed.js"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  EXPO_PUBLIC_CONVEX_URL = "https://zealous-scorpion-285.convex.cloud"
  EXPO_PUBLIC_CONVEX_SITE_URL = "https://zealous-scorpion-285.convex.site"
  EXPO_PUBLIC_PRODUCT_PRESET = "demo"
