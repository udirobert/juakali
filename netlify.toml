# Netlify — Expo web (SPA) for investor review
# Docs: https://docs.expo.dev/guides/publishing-websites/#netlify
# Use npm here so builds don't depend on mise downloading Bun (GitHub release 503s).

[build]
  base = "/"
  command = "npm install --ignore-scripts && npm run export:web -w @bloom/mobile"
  publish = "apps/default/dist"

[build.environment]
  NODE_VERSION = "22"
  HUSKY = "0"
  # Public Convex prod (safe to bake into the client bundle)
  EXPO_PUBLIC_CONVEX_URL = "https://zealous-scorpion-285.convex.cloud"
  EXPO_PUBLIC_CONVEX_SITE_URL = "https://zealous-scorpion-285.convex.site"
  # Lab chat optional until Cloud Run is live
  # EXPO_PUBLIC_AGENT_URL = "https://your-agent.run.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  EXPO_PUBLIC_CONVEX_URL = "https://zealous-scorpion-285.convex.cloud"
  EXPO_PUBLIC_CONVEX_SITE_URL = "https://zealous-scorpion-285.convex.site"
